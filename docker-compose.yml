  django:
    build: .
    container_name: matrimony_backend-django-1
    restart: unless-stopped

    command:
      [
        "gunicorn",
        "matrimony_backend.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
        "--threads",
        "2",
        "--timeout",
        "120",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-"
      ]

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: matrimony_backend.settings

      DEBUG: "0"

      REDIS_URL: redis://redis:6379/0

      ALLOWED_HOSTS: "*"

      DATABASE_ENGINE: mysql
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: aiswaryamatrimony
      DATABASE_USER: matrimony_user
      DATABASE_PASSWORD: Matrimonial@123

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
