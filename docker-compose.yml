services:
  db:
    image: mariadb:11.4
    container_name: matrimony_backend-db-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword@123
      MYSQL_DATABASE: aiswaryamatrimony
      MYSQL_USER: matrimony_user
      MYSQL_PASSWORD: Matrimonial@123
    ports:
      - "3306:3306"
    volumes:
      - matrimony_backend_mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mariadb-admin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pRootPassword@123",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      default:
        ipv4_address: 172.28.0.10

  redis:
    image: redis:7-alpine
    container_name: matrimony_backend-redis-1
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      default:
        ipv4_address: 172.28.0.11

  django:
    build: .
    container_name: matrimony_backend-django-1
    restart: unless-stopped
    # Fixed IP so host Nginx can reach Daphne WITHOUT docker-proxy.
    # On this VPS, published ports (127.0.0.1:8000->container) accept TCP but
    # never deliver HTTP. Container↔container and host→172.28.0.12 work.
    # Daphne (ASGI) is required for Channels WebSockets at /ws/chat/<id>/.
    networks:
      default:
        ipv4_address: 172.28.0.12
    command:
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "8000"
      - --proxy-headers
      - matrimony_backend.asgi:application
    volumes:
      - .:/app
    # Do not publish 8000 on the host — docker-proxy path is broken here.
    # Nginx must proxy to http://172.28.0.12:8000
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: matrimony_backend.settings
      DEBUG: "0"
      HEALTH_DEBUG_LOG: "1"
      REDIS_SOCKET_CONNECT_TIMEOUT: "2"
      REDIS_SOCKET_TIMEOUT: "2"
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: "*"
      DATABASE_ENGINE: mysql
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: aiswaryamatrimony
      DATABASE_USER: matrimony_user
      DATABASE_PASSWORD: Matrimonial@123
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: matrimony_backend-celery_worker-1
    restart: unless-stopped
    entrypoint:
      - /celery-entrypoint.sh
    command:
      - -A
      - matrimony_backend
      - worker
      - -l
      - info
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: matrimony_backend.settings
      DEBUG: "0"
      REDIS_URL: redis://redis:6379/0
      DATABASE_ENGINE: mysql
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: aiswaryamatrimony
      DATABASE_USER: matrimony_user
      DATABASE_PASSWORD: Matrimonial@123
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: matrimony_backend-celery_beat-1
    restart: unless-stopped
    entrypoint:
      - /celery-entrypoint.sh
    command:
      - -A
      - matrimony_backend
      - beat
      - -l
      - info
    volumes:
      - .:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: matrimony_backend.settings
      DEBUG: "0"
      REDIS_URL: redis://redis:6379/0
      DATABASE_ENGINE: mysql
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: aiswaryamatrimony
      DATABASE_USER: matrimony_user
      DATABASE_PASSWORD: Matrimonial@123
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_started
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

networks:
  default:
    name: matrimony_backend_net
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  matrimony_backend_mariadb_data:
    external: true
