services:
  django:
    build: .
    command:
      [
        "daphne",
        "-b",
        "0.0.0.0",
        "-p",
        "8000",
        "matrimony_backend.asgi:application",
      ]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DJANGO_SETTINGS_MODULE=matrimony_backend.settings
      - DEBUG=0
      - DATABASE_ENGINE=mysql
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3308
      - DATABASE_NAME=aiswaryamatrimony
      - DATABASE_USER=root
      - DATABASE_PASSWORD=admin
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  celery_worker:
    build: .
    entrypoint: ["/celery-entrypoint.sh"]
    command: ["-A", "matrimony_backend", "worker", "-l", "info"]
    volumes:
      - .:/app
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DJANGO_SETTINGS_MODULE=matrimony_backend.settings
      - DEBUG=0
      - DATABASE_ENGINE=mysql
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3308
      - DATABASE_NAME=aiswaryamatrimony
      - DATABASE_USER=root
      - DATABASE_PASSWORD=admin
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      django:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    build: .
    entrypoint: ["/celery-entrypoint.sh"]
    command: ["-A", "matrimony_backend", "beat", "-l", "info"]
    volumes:
      - .:/app
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DJANGO_SETTINGS_MODULE=matrimony_backend.settings
      - DEBUG=0
      - DATABASE_ENGINE=mysql
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3308
      - DATABASE_NAME=aiswaryamatrimony
      - DATABASE_USER=root
      - DATABASE_PASSWORD=admin
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      django:
        condition: service_started
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    restart: unless-stopped

networks:
  default:
    name: matrimony_backend_net
