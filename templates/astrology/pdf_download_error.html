<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .dialog {
      width: min(100%, 420px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .header {
      padding: 1.25rem 1.5rem 0.75rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .header h1 {
      margin: 0;
      font-size: 1.125rem;
      color: #7f1d1d;
    }
    .body {
      padding: 1.25rem 1.5rem 1.5rem;
      color: #334155;
      line-height: 1.5;
    }
    #pdf-error-message {
      margin: 0 0 1.25rem;
      font-size: 0.95rem;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 0.625rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .primary {
      background: #9f1239;
      color: #fff;
    }
    .secondary {
      background: #f1f5f9;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="dialog" role="alertdialog" aria-labelledby="dialog-title" aria-describedby="pdf-error-message">
    <div class="header">
      <h1 id="dialog-title">{{ title }}</h1>
    </div>
    <div class="body">
      <p id="pdf-error-message">{{ message }}</p>
      <div class="actions">
        <button type="button" class="secondary" onclick="window.close()">Close</button>
        <button type="button" class="primary" onclick="window.history.length > 1 ? window.history.back() : window.close()">Go back</button>
      </div>
    </div>
  </div>
</body>
</html>
